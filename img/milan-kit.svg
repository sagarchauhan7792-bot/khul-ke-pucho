  <text x="500" y="934" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="19" letter-spacing="5" fill="#7A5C46" opacity="0.5">KHUL KE PUCHO</text>

<rect width="1000" height="1000" fill="url(#vig)"/>
