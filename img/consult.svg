  <text x="410" y="180" text-anchor="middle" font-family="Verdana,sans-serif" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#DDB967">PRIVATE CALL</text>

  <!-- doctor avatar -->
  <circle cx="400" cy="312" r="74" fill="#F7EFDF"/>
  <circle cx="400" cy="290" r="26" fill="#5E1F30"/>
  <path d="M352 360 q48 -40 96 0 l0 12 q-48 22 -96 0 Z" fill="#5E1F30"/>
  <path d="M376 352 q24 16 48 0" stroke="#C9962E" stroke-width="4" fill="none"/>
