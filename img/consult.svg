  <text x="400" y="428" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#F7EFDF">Dr. — वैद्य</text>
  <text x="400" y="452" text-anchor="middle" font-family="Verdana,sans-serif" font-size="12" fill="#DDB967">Registered practitioner</text>

  <!-- chat bubbles -->
  <rect x="304" y="480" width="150" height="36" rx="12" fill="#F7EFDF"/>
  <text x="318" y="503" font-family="Verdana,sans-serif" font-size="12" fill="#241419">Khul ke puchiye…</text>
