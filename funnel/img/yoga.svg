  <rect x="196" y="520" width="408" height="62" rx="31" fill="url(#mat)"/>
  <circle cx="604" cy="551" r="31" fill="#4A1826"/>
  <circle cx="604" cy="551" r="20" fill="#F7EFDF"/>
  <circle cx="604" cy="551" r="8" fill="#C9962E"/>
  <rect x="330" y="514" width="18" height="74" rx="9" fill="#C9962E"/>
