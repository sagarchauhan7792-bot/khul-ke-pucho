  <text x="400" y="646" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-weight="bold" letter-spacing="2" fill="#5E1F30">YOGA FOR VITALITY</text>
  <text x="400" y="676" text-anchor="middle" font-family="Verdana,sans-serif" font-size="13" letter-spacing="2" fill="#7A5C46">ASANA · PRANAYAMA · 20 MIN A DAY</text>
  <text x="400" y="736" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="4" fill="#7A5C46">KHUL KE PUCHO</text>
