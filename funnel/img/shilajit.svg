<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFDF"/><stop offset="1" stop-color="#EFE3CC"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A2027"/><stop offset=".45" stop-color="#241419"/><stop offset="1" stop-color="#150B0E"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDB967"/><stop offset=".5" stop-color="#C9962E"/><stop offset="1" stop-color="#9E7420"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="255" fill="none" stroke="#C9962E" stroke-width="1.5" opacity=".35"/>
  <circle cx="400" cy="400" r="285" fill="none" stroke="#C9962E" stroke-width="1" opacity=".18"/>
  <ellipse cx="400" cy="662" rx="200" ry="26" fill="#241419" opacity=".14"/>

  <!-- squat jar -->
  <rect x="288" y="238" width="224" height="74" rx="12" fill="url(#lid)"/>
  <rect x="288" y="262" width="224" height="5" fill="#9E7420" opacity=".6"/>
  <path d="M258 320 Q258 302 286 302 L514 302 Q542 302 542 320 L542 618 Q542 654 500 654 L300 654 Q258 654 258 618 Z" fill="url(#glass)"/>
  <rect x="282" y="322" width="22" height="300" rx="11" fill="#FFFFFF" opacity=".09"/>

  <!-- resin drip visible at jar mouth -->
  <path d="M300 302 q20 26 42 8 q18 20 38 4 q22 22 40 2 q20 18 44 6 q16 14 36 4 l0 -22 -200 0 Z" fill="#150B0E"/>

  <!-- label -->
  <rect x="286" y="368" width="228" height="216" rx="14" fill="#F7EFDF"/>
  <rect x="294" y="376" width="212" height="200" rx="10" fill="none" stroke="#C9962E" stroke-width="2"/>
  <g fill="none" stroke="#C9962E" stroke-width="4" stroke-linecap="round">
    <path d="M400 446 C388 446 378 438 374 426 C384 428 392 432 400 440 C408 432 416 428 426 426 C422 438 412 446 400 446 Z"/>
    <path d="M400 440 C396 428 396 416 400 406 C404 416 404 428 400 440 Z"/>
    <circle cx="400" cy="396" r="3" fill="#C9962E" stroke="none"/>
  </g>
  <text x="400" y="482" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#7A5C46">शुद्ध शिलाजीत</text>
  <text x="400" y="518" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="bold" letter-spacing="3" fill="#5E1F30">SHILAJIT</text>
  <rect x="330" y="534" width="140" height="2" fill="#C9962E"/>
  <text x="400" y="558" text-anchor="middle" font-family="Verdana,sans-serif" font-size="13" letter-spacing="2" fill="#7A5C46">HIMALAYAN · 40% FULVIC ACID · 20g</text>

  <!-- seal band -->
  <rect x="258" y="600" width="284" height="34" fill="#4A1826"/>
  <text x="400" y="623" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#DDB967">आरोग्यं मूलमुत्तमम्</text>
  <text x="400" y="722" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="4" fill="#7A5C46">KHUL KE PUCHO</text>
</svg>
